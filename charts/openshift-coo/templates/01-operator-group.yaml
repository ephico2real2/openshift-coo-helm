{{- /*
COO supports AllNamespaces only: an OperatorGroup with no targetNamespaces. It is part of installing the operator,
not of the namespace: it is rendered whether or not the chart creates the namespace (namespace.create). Without one
OLM stages nothing and reports nothing (measured: docs/evidence/crc/16-operatorgroup.txt). OLM allows one
OperatorGroup per namespace, so operatorGroup.create=false is for a namespace that already holds its own.
*/ -}}
{{- if .Values.operatorGroup.create }}
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ .Values.operator.package }}
  namespace: {{ include "openshift-coo.namespace" . }}
  labels:
    {{- include "openshift-coo.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec: {}
{{- end }}
