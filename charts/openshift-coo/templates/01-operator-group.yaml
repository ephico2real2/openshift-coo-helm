{{- /*
COO supports AllNamespaces only: an OperatorGroup with no targetNamespaces. OLM allows one OperatorGroup per
namespace, so with namespace.create=false the existing one is used and none is rendered.
*/ -}}
{{- if .Values.namespace.create }}
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ .Values.operator.package }}
  namespace: {{ include "openshift-coo.namespace" . }}
  labels:
    {{- include "openshift-coo.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec: {}
{{- end }}
