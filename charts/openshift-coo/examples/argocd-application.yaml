# COO through Argo CD (OpenShift GitOps). The Application points at COO's namespace; the chart creates that
# namespace itself (wave -3), with the label the platform needs, so no CreateNamespace here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openshift-coo
  namespace: openshift-gitops
  # Deleting the Application deletes what it installed. Argo CD adds its own post-delete finalizers beside this one
  # (they run the cleanup hook); never replace the list with a patch, or the cleanup is skipped (measured).
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ephico2real2/openshift-coo-helm.git
    targetRevision: main
    path: charts/openshift-coo
    helm:
      # The UIPlugin CRD then comes from OLM, before the UIPlugin's wave (measured: first sync green with no COO CRD
      # beforehand). Without it Argo CD would also track the CRD, and could delete it with the Application (not measured).
      skipCrds: true
      valuesObject:
        metricsAccess:
          groups: [system:authenticated]   # everyone who logs in sees dashboard data (no PHI/PII in metrics)
        cleanup:
          # The post-delete cleanup Job runs here: a namespace that survives the deletion (COO's own does not).
          namespace: platform-tools
        # The Grafana-to-Perses converter page, in the same platform namespace (docs/converter.md).
        converter:
          enabled: true
          namespace: platform-tools
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-cluster-observability-operator
  syncPolicy:
    automated: {}
