apiVersion: v2
name: openshift-coo
description: >-
  Red Hat's Cluster Observability Operator (COO) on OpenShift, hands-free: the operator through OLM with a
  Manual InstallPlan the chart approves for the pinned version only, the monitoring UIPlugin with Perses
  (dashboards under Observe -> Dashboards (Perses)), metrics access for dashboard viewers, and a gate that
  returns only when all of it works.
type: application
version: 0.5.0
# The COO version this chart installs and was measured with; values.yaml sets operator.version to the same version.
appVersion: "1.5.3"
# OpenShift 4.19 (Kubernetes 1.32) or later: Red Hat lists incident detection (the UIPlugin's clusterHealthAnalyzer,
# on by default here) as GA from 4.19.
kubeVersion: ">=1.32.0-0"
keywords: [openshift, observability, perses, dashboards, cluster-observability-operator, olm]
home: https://github.com/ephico2real2/openshift-coo-helm
sources:
  - https://github.com/ephico2real2/openshift-coo-helm/tree/main/charts/openshift-coo
maintainers:
  - name: ephico2real2
