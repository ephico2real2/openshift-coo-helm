# openshift-coo: Red Hat's Cluster Observability Operator (COO) with Perses, hands-free.
# The choices below rest on measurements on OpenShift Local (CRC 4.22.7) with COO 1.5.2 and 1.5.3:
# docs/manual-install-findings.md and docs/evidence/crc/. The Jobs' budgets, image and TTL are defaults, not measured.
#
# WHERE THE RELEASE LIVES. The chart creates COO's namespace itself (namespace.create), with the label the
# platform needs to scrape COO, so Helm's record of the release cannot live in it: install the release into a
# namespace that already exists, for example
#   helm install openshift-coo charts/openshift-coo -n platform-tools --create-namespace
# Argo CD keeps no record in the cluster: point the Application at COO's namespace, without CreateNamespace.

# COO's namespace. COO supports one install mode, AllNamespaces, so there is one COO per cluster.
namespace:
  name: openshift-cluster-observability-operator
  # true: the chart creates it with openshift.io/cluster-monitoring: "true", so the platform Prometheus scrapes
  # COO (COO's CSV asks for it). `helm uninstall` then deletes the namespace, which removes the operator and its
  # CSV with it (OLM leaves a CSV behind when only the Subscription is deleted).
  # false: the namespace already exists, made outside this chart, and carries that label. The chart still
  # installs the operator into it: the OperatorGroup below does not depend on this value.
  create: true

# The OperatorGroup that lets OLM install COO in the namespace: one with no targetNamespaces (AllNamespaces, the
# only install mode COO supports). Independent of namespace.create.
operatorGroup:
  # true: the chart creates it, named after operator.package.
  # false: the namespace already holds an OperatorGroup with no targetNamespaces. OLM allows one per namespace:
  # with two it installs nothing, and with none it installs nothing and says nothing. The approver Job checks
  # for exactly one before it waits, and fails with the reason.
  create: true

operator:
  # The COO version to install, and the ONLY version the approver approves. A newer version that OLM stages
  # waits for a human; to upgrade, change this and upgrade the release (measured: helm upgrade 1.5.2 -> 1.5.3
  # deployed in 70 s, gate green: docs/evidence/crc/11-chart-on-crc.txt section 7).
  version: "1.5.3"
  channel: stable
  # The package as the catalog names it: the Subscription's spec.name and the prefix of every CSV name.
  package: cluster-observability-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace

# Approves the InstallPlan of operator.version only, after checking the plan's CSV list names exactly
# <package>.v<version>. OLM's copies of other operators' CSVs (they appear in every namespace) are never matched.
installPlanApprover:
  waitSeconds: 300

# Clears a CSV that a previous uninstall left behind with no Subscription: the case that blocks a reinstall
# (measured: ResolutionFailed within 20 s, no InstallPlan in 2 minutes; deleting the CSV staged one in 5 s).
# It deletes only an unowned, unreferenced, settled CSV of this package, and only after OLM reports
# ResolutionFailed. With namespace.create the uninstall deletes the CSV anyway; this covers namespace.create=false.
csvReclaim:
  enabled: true
  waitSeconds: 120

# The monitoring UIPlugin: it runs the Perses server and adds Observe -> Dashboards (Perses) to the console.
uiPlugin:
  perses: true
  # Incident detection (health-analyzer), GA on OpenShift 4.19 and later, the chart's minimum. Keep it on: with this
  # off (and the deprecated incidents off), COO deletes its own scrape grant (measured with Perses on; README, Known
  # issues); platformScrapeRBAC below covers that too.
  clusterHealthAnalyzer: true

# The chart's own grant for the platform Prometheus to scrape COO: COO's Role and RoleBinding of the same rules,
# named prometheus-k8s, are deleted by COO itself in two measured cases (the UIPlugin with clusterHealthAnalyzer
# off, and the UIPlugin's deletion). This pair carries the chart's name, so COO never deletes it, and a grant stays
# in place whatever clusterHealthAnalyzer is (measured: COO scraped throughout with it off, evidence 11 section 2).
# Keep it on (README, Known issues).
platformScrapeRBAC: true

# Who may see the metrics behind application dashboards. Dashboards query Thanos Querier's port 9091, which
# checks cluster-monitoring-view (decision: docs/manual-install-findings.md section 6a). Each group listed is
# bound to that ClusterRole, which grants read access to metrics and nothing else; for example
# system:authenticated, everyone who can log in. Empty: nothing is bound.
metricsAccess:
  groups: []

# The post-install gate: returns when COO's CSV is Succeeded, the UIPlugin is Available, the console lists the
# plugin, Perses is ready, the namespace carries openshift.io/cluster-monitoring=true, and a Role and RoleBinding
# for the platform Prometheus exist (the chart's own with platformScrapeRBAC, else COO's prometheus-k8s);
# otherwise it fails and says which.
# Helm waits for hooks only up to its --timeout (default 5m): pass --timeout 15m.
wait:
  waitSeconds: 600
  intervalSeconds: 10

# After an uninstall, removes what COO leaves behind that is safe to remove (README, Uninstall): COO's six Perses team
# ClusterRoles, and, with consolePlugin, the monitoring-console-plugin entry in the console's plugin list once its
# ConsolePlugin is gone. Never COO's CRDs: they hold every application's Perses dashboards. Nothing is removed while COO
# is still installed. A Helm post-delete / Argo CD PostDelete hook (Argo CD 2.10 or later).
cleanup:
  enabled: true
  # Patch the cluster's console config to drop that one entry (get/patch on consoles.operator.openshift.io "cluster").
  consolePlugin: true
  # Where the Job runs: a namespace that survives the uninstall. Empty: the release's namespace. Under Argo CD, whose
  # Application targets COO's namespace (deleted with namespace.create), set it, for example to platform-tools.
  namespace: ""
  waitSeconds: 120

# A web page that converts a Grafana dashboard to a Perses dashboard: upload the Grafana JSON, read what
# converted, download a PersesDashboard for a namespace (docs/converter.md). One shared instance for every team.
# Off by default. It is guarded by the OpenShift login: any user who can log in may use it.
converter:
  enabled: false
  # Where it runs: a platform namespace that exists already, for example platform-tools. Empty: the release's
  # namespace. Under Argo CD, whose Application targets COO's namespace, set it.
  namespace: ""
  # The Perses version that converts. Keep it at the Perses version of the installed COO: 0.54.0 is in the
  # go.mod of COO 1.5.2 and 1.5.3 (COO's own server reports no version).
  persesVersion: "0.54.0"
  # How often the page and the login proxy are checked once the pod is up: every 30 minutes (900 is 15). One
  # failed check restarts that container. A start-up check (every 5 s, until the first success) decides when
  # the pod is Ready; there is no other periodic check.
  livenessPeriodSeconds: 1800
  # The largest upload, in bytes (2 MiB). A Grafana dashboard is rarely above a few hundred KiB.
  maxUploadBytes: 2097152
  # The datasource URL written into a PersesDatasource the page can add: Thanos Querier's cluster-wide port.
  # The per-namespace port (9092) refuses the Perses UI's POST queries for readers.
  thanosURL: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
  route:
    # Empty: the cluster picks perses-converter-<namespace>.<apps domain>.
    host: ""
  # In: the routers only. Out: DNS and TCP 443 and 6443 (the login). Converting itself needs no connection.
  networkPolicy:
    enabled: true
  images:
    # The official Perses image: its server is the conversion engine. The tag is v<persesVersion>.
    perses: docker.io/persesdev/perses
    # Runs the page (files/converter/server.py, standard library only) and mints the session key.
    python: registry.access.redhat.com/ubi9/python-312:latest
    oauthProxy: registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:v4.15
  resources:
    perses:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}
    web:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {memory: 256Mi}

# The image of the four Jobs (reclaim, approver, gate, cleanup): a shell and oc.
jobs:
  image:
    repository: registry.redhat.io/openshift4/ose-cli
    tag: latest
  # A namespace whose ResourceQuota requires requests refuses a pod without them.
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
  ttlSecondsAfterFinished: 600
